[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "yunxianliu", email = "yunxian.liu1997@gmail.com" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=1.10,<2"]

[dependency-groups]
dev = ["pre-commit==4.2.0", "ruff==0.12.11"]

# This repository currently contains scripts, not an installable Python package.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
